name: ESPHome Config Validation

on:
  push:
    paths:
      - "Devices/**"
      - "images/**"
      - "README*.md"
      - "tools/**"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "Devices/**"
      - "images/**"
      - "README*.md"
      - "tools/**"
      - ".github/workflows/*.yml"
  workflow_dispatch:

jobs:
  check-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check docs/assets sync
        run: python tools/check_assets.py

  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome==2026.7.3

      - name: Create temporary secrets for validation
        run: |
          echo 'wifi_ssid: "ci-wifi"' > "Devices/Modular/secrets.yaml"
          echo 'wifi_password: "ci-password"' >> "Devices/Modular/secrets.yaml"

      - name: Validate modular configs
        run: |
          set -euo pipefail
          shopt -s nullglob
          for yaml in Devices/Modular/*.yaml; do
            if [[ "$(basename "$yaml")" == secrets*.yaml ]]; then
              continue
            fi
            echo "=== Validating $yaml ==="
            esphome config "$yaml"
          done

      - name: Cleanup temporary secrets
        if: always()
        run: rm -f "Devices/Modular/secrets.yaml"
